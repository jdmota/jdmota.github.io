<!DOCTYPE html>
<html>
  <head>
    <title>QR Code Generator</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, shrink-to-fit=no"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <input id="text" type="text" placeholder="Enter text here!" />
      <span id="label-error-level">Error Correction Level:</span>
      <select id="error-level">
        <option value="high">High</option>
        <option value="quartile">Quartile</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <button id="generate">Generate</button>
      <div id="result-buttons">
        <button id="download-png">Download PNG image</button>
        <button id="download-svg">Download SVG image</button>
        <div class="clear"></div>
      </div>
      <div id="result"></div>
    </div>
    <script src="index.ts" type="module"></script>
  </body>
</html>
