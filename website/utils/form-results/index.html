<!doctype html>
<html>
  <head>
    <title>Form Results Analyzer</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, shrink-to-fit=no"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div id="file">
        <span>Select a CSV file:</span>
        <input type="file" />
      </div>
      <div id="smart-split">
        <div>
          Write the questions (in different lines) that accept multiple answers
          (and click "Import"):
        </div>
        <div><textarea></textarea></div>
      </div>
      <div id="import">
        <button>Import</button>
      </div>
      <div id="warnings-container">
        <div><h4 id="warnings-title">0 import warnings</h4></div>
        <div id="warnings"></div>
      </div>
      <div id="formula" class="hidden">
        <div class="question">
          <select></select>
        </div>
        <div class="option">
          <select></select>
        </div>
        <div class="buttons">
          <button>Add it</button>
          <button>AND</button>
          <button>OR</button>
          <button>NOT</button>
          <button>ALL</button>
          <button>NONE</button>
          <button>(</button>
          <button>)</button>
          <button>Del</button>
          <button>Filter!</button>
        </div>
        <div class="expression"></div>
        <div class="feedback">0 filtered results</div>
      </div>
      <div id="projections">
        <table>
          <tbody></tbody>
        </table>
      </div>
      <div id="results">
        <table>
          <thead>
            <tr></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <script src="index.ts" type="module"></script>
  </body>
</html>
